name: Full Lead Intelligence Pipeline (Batch)

on:
  workflow_dispatch:    # ম্যানুয়াল ট্রিগার

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        volumes:
          - ollama_data:/root/.ollama
        options: >-
          --name ollama_container

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lead_user
          POSTGRES_PASSWORD: lead_pass
          POSTGRES_DB: lead_intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Install Node tools
        run: |
          npm install -g wappalyzer lighthouse

      - name: Pull Ollama model (tinyllama)
        run: |
          # Wait for Ollama to start
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama ready"
              break
            fi
            echo "Waiting for Ollama..."
            sleep 5
          done
          docker exec ollama_container ollama pull tinyllama:latest

      - name: Prepare input (sample list)
        run: |
          mkdir -p input
          if [ ! -f input/business_list.csv ]; then
            echo "name,website" > input/business_list.csv
            # আপনার নিজের লিস্ট দিতে পারেন এই ফরম্যাটে
            echo "Example Corp,example.com" >> input/business_list.csv
            echo "Test Agency,test.com" >> input/business_list.csv
          fi

      - name: Run full pipeline
        env:
          DATABASE_URL: postgresql://lead_user:lead_pass@localhost:5432/lead_intel
          OLLAMA_HOST: http://localhost:11434
        run: python run_pipeline.py --input input/business_list.csv

      - name: Upload enriched leads
        uses: actions/upload-artifact@v4
        with:
          name: enriched-leads
          path: output/enriched_leads.csv
