name: Full Lead Intelligence Pipeline (Batch)

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        volumes:
          - ollama_data:/root/.ollama
        options: >-
          --name ollama_container

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lead_user
          POSTGRES_PASSWORD: lead_pass
          POSTGRES_DB: lead_intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Install Node tools
        run: |
          npm install -g lighthouse

      - name: Pull Ollama model (tinyllama)
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama ready"
              break
            fi
            echo "Waiting for Ollama..."
            sleep 5
          done
          docker exec ollama_container ollama pull tinyllama:latest

      - name: Run full pipeline
        env:
          DATABASE_URL: postgresql://lead_user:lead_pass@localhost:5432/lead_intel
          OLLAMA_HOST: http://localhost:11434
        run: |
          FILE=$(find input -maxdepth 1 -type f \( -name "*.csv" -o -name "*.xlsx" \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "input/ ফোল্ডারে কোনো .csv বা .xlsx ফাইল পাওয়া যায়নি।"
            exit 1
          fi
          echo "Using input file: $FILE"
          python run_pipeline.py --input "$FILE"

      - name: Upload enriched leads
        uses: actions/upload-artifact@v4
        with:
          name: enriched-leads
          path: output/enriched_leads.csv
